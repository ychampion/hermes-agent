name: Hermes cache sync verification

on:
  push:
    branches: [verification/hermes-158690-windows]

permissions:
  contents: read

jobs:
  cache-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install dependencies used by the sync modules
        run: python -m pip install psutil==7.2.2 ruamel.yaml==0.18.16 python-dotenv==1.2.4 PyYAML==6.0.3 requests==2.34.2 rich==14.3.4
      - name: Test upstream main, release, and existing pull request
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONUTF8=1
          git init candidate
          git -C candidate -c core.longpaths=true fetch --no-tags --depth 1 https://github.com/NousResearch/hermes-agent.git \
            3b1ce49ad3b3156c25ed2aa8fdf9bfb69d011bad \
            2861fe3744f8134b782659438961a4f69ab5d495 \
            e5237b757560580a70a7c2ec4bee5111ddc43b01
          cd candidate
          git config core.longpaths true
          for revision in 3b1ce49ad3b3156c25ed2aa8fdf9bfb69d011bad 2861fe3744f8134b782659438961a4f69ab5d495 e5237b757560580a70a7c2ec4bee5111ddc43b01; do
            git checkout --quiet --detach "$revision"
            extra=()
            if [[ "$RUNNER_OS" == 'Windows' && "$revision" != e5237b757560580a70a7c2ec4bee5111ddc43b01 ]]; then
              extra+=(--expect-mismatch)
            fi
            python -c 'import runpy; runpy.run_path("../check_cache_sync.py", run_name="__main__")' --revision "$revision" "${extra[@]}"
          done
